<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>ভাড়ার খাতা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wdth,wght@75..125,300..800&family=Atma:wght@500;600&display=swap">
<style>
@property --fill{syntax:'<percentage>';inherits:false;initial-value:0%}
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --font:"Anek Bangla","Hind Siliguri","Noto Sans Bengali","Nirmala UI","Kohinoor Bangla","Bangla Sangam MN","Vrinda",system-ui,sans-serif;
  --hand:"Atma","Anek Bangla","Noto Sans Bengali","Nirmala UI",sans-serif;
  --bg:#EDF0EB;--surface:#FFFFFF;--surface-2:#F4F7F3;--ink:#15211B;--muted:#56655D;--line:#D3DBD5;
  --green:#006A4E;--green-ink:#FFFFFF;--green-soft:#DDEFE6;
  --red:#C21F32;--red-ink:#FFFFFF;--red-soft:#FBE4E6;
  --amber:#965800;--amber-soft:#FAEBD0;
  --focus:#1D5FD1;--scrim:rgba(12,20,16,.5);--shadow:0 14px 36px rgba(21,33,27,.22);
  --paper:#FFF1BF;--carbon:#33327C;--stamp:#B1233B;
  /* the header band is the ledger's green cover; it stays dark in both themes, so light ink on it */
  --head:#00563F;--head-ink:#FFFFFF;--head-muted:rgba(255,255,255,.78);--head-soft:rgba(255,255,255,.12);--head-line:rgba(255,255,255,.28);--head-ok:#A6EBCB;--head-err:#FFD0D5;
  /* the house picture: lime-washed plaster, dark edges, concrete floor slabs and window sills */
  --wall:#F8F4EC;--wall-edge:#34413A;--slab:#E3DED3;--sill:#B5AE9F;
  --plate:#E2EEE7;--plate-ink:#0B4F3A;
  --lift:0 1px 2px rgba(21,33,27,.05),0 6px 18px -10px rgba(21,33,27,.24);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512;--surface:#161F1B;--surface-2:#1C2722;--ink:#E4ECE6;--muted:#9AA9A1;--line:#2B3833;
    --green:#3DBA8B;--green-ink:#04130D;--green-soft:#163829;
    --red:#FF6E7B;--red-ink:#2A060B;--red-soft:#3B191E;
    --amber:#F1B34B;--amber-soft:#3A2B12;
    --focus:#8AB4FF;--scrim:rgba(0,0,0,.6);--shadow:0 14px 36px rgba(0,0,0,.55);
    --head:#123A2D;--wall:#1B2420;--wall-edge:#9FB2A8;--slab:#2D3933;--sill:#4C5C54;--plate:#1E3329;--plate-ink:#9EE0C3;
    --lift:0 1px 0 rgba(255,255,255,.03),0 8px 22px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512;--surface:#161F1B;--surface-2:#1C2722;--ink:#E4ECE6;--muted:#9AA9A1;--line:#2B3833;
  --green:#3DBA8B;--green-ink:#04130D;--green-soft:#163829;
  --red:#FF6E7B;--red-ink:#2A060B;--red-soft:#3B191E;
  --amber:#F1B34B;--amber-soft:#3A2B12;
  --focus:#8AB4FF;--scrim:rgba(0,0,0,.6);--shadow:0 14px 36px rgba(0,0,0,.55);
  --head:#123A2D;--wall:#1B2420;--wall-edge:#9FB2A8;--slab:#2D3933;--sill:#4C5C54;--plate:#1E3329;--plate-ink:#9EE0C3;
  --lift:0 1px 0 rgba(255,255,255,.03),0 8px 22px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--head)}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.35}
a{color:var(--green)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
[hidden]{display:none!important}
.txt-due{color:var(--red)}
.txt-ok{color:var(--green)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--head);color:var(--head-ink);box-shadow:0 8px 20px -14px rgba(0,40,28,.7)}
.top-in{max-width:680px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:1.2rem;font-weight:700;font-stretch:112%;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand p{margin:0;font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;color:var(--muted);white-space:nowrap;background:none;border:0;padding:4px 2px}
.sync.ok{color:var(--green)}
.sync.err{color:var(--red);text-decoration:underline;text-underline-offset:3px}
button.sync{min-height:40px;padding:4px 6px;border-radius:8px}
.sync svg{flex:none}
.where{display:flex;align-items:flex-start;gap:12px;padding:14px;border-radius:12px;margin:0 0 12px;background:var(--green-soft)}
.where svg{flex:none;color:var(--green)}
.where.local{background:var(--amber-soft)}
.where.local svg{color:var(--amber)}
.where b{display:block;font-size:1.05rem;line-height:1.35}
.where small{display:block;margin-top:3px;font-size:.86rem;color:var(--muted)}
.facts.one{grid-template-columns:minmax(0,1fr)}
.facts.one dd{font-weight:500;font-stretch:100%}
.facts dd small{display:block;font-size:.8rem;font-weight:500;color:var(--muted)}
.st-ok{color:var(--green)}
.st-err{color:var(--red)}
.st-line{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.st-line>span{display:inline-flex;align-items:center;gap:4px}
.st-line svg{flex:none}
.row-title.wrap{white-space:normal}
.tech ul{margin:0;padding:0 0 0 20px;font-size:.86rem;color:var(--muted);line-height:1.6}
.tech code{font-size:.84rem;color:var(--ink);overflow-wrap:anywhere}
.icon-btn{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:inline-grid;place-items:center;padding:0}
.icon-btn:hover:not(:disabled){background:var(--surface-2)}
.lang-btn{width:auto;min-width:44px;padding:0 11px;font-weight:700;font-size:.86rem;letter-spacing:.02em}
/* phones: three header buttons, so leave the house name a little more room */
@media (max-width:420px){
  .top-in{gap:6px;padding:10px 12px}
  .top-in .icon-btn{width:40px}
  .top-in .lang-btn{width:auto;min-width:40px;padding:0 8px}
}
/* the narrowest phones: the save chip keeps only its icon (tap it for the full story) */
@media (max-width:360px){.sync .lbl{display:none}}
/* everything sitting on the green header band */
.top .brand p{color:var(--head-muted)}
.top .sync{color:var(--head-muted)}
.top .sync.ok{color:var(--head-ok)}
.top .sync.err{color:var(--head-err)}
.top button.sync:hover{background:var(--head-soft)}
.top .icon-btn{background:var(--head-soft);border-color:var(--head-line);color:var(--head-ink)}
.top .icon-btn:hover:not(:disabled){background:var(--head-line)}
.top .chip{background:var(--head-soft);border-color:var(--head-line);color:var(--head-ink)}
.top .chip:hover{background:var(--head-line)}
.top .chip[aria-pressed="true"]{background:var(--head-ink);border-color:var(--head-ink);color:var(--head);font-weight:600}
.top :focus-visible{outline-color:var(--head-ink)}

/* layout */
main{max-width:680px;margin:0 auto;padding:16px 16px 104px}
.loading{display:flex;align-items:center;justify-content:center;gap:10px;min-height:50vh;color:var(--muted)}
.spin{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:0 0 14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -10px 24px -20px rgba(21,33,27,.45);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.tab{border:0;background:none;color:var(--muted);padding:7px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.82rem;min-height:58px}
/* the open tab: its icon sits on a soft green pill */
.tab svg{box-sizing:content-box;padding:3px 14px;border-radius:999px;transition:background .2s}
.tab:hover svg{background:var(--surface-2)}
.tab[aria-current="page"]{color:var(--green);font-weight:600}
.tab[aria-current="page"] svg{stroke-width:2.3;background:var(--green-soft)}

/* month and year bars */
.monthbar{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.mb-mid{flex:1;text-align:center;min-width:0}
.mb-mid h2{margin:0;font-size:1.55rem;font-weight:700;font-stretch:108%;line-height:1.2}
.mb-sub{margin:1px 0 0;font-size:.84rem;color:var(--muted)}
.link{background:none;border:0;color:var(--green);text-decoration:underline;text-underline-offset:3px;padding:6px 8px;font-size:.95rem}
.link.sm{font-size:.85rem;padding:2px 6px}

/* the building */
.bldg-wrap{position:relative;width:fit-content;min-width:min(220px,100%);max-width:100%;margin:24px auto 0}
.bldg{position:relative;border:2px solid var(--wall-edge);border-top-width:4px;border-bottom:0;border-radius:3px 3px 0 0;padding:12px 12px 8px;background:var(--wall);box-shadow:0 14px 30px -22px rgba(21,33,27,.6)}
/* the roof's water tank */
.bldg::before{content:"";position:absolute;right:26px;top:-20px;width:34px;height:14px;border:2px solid var(--wall-edge);border-bottom:0;border-radius:3px 3px 0 0;background:var(--wall)}
/* the street gate: a grille at the foot of the building */
.bldg{padding-bottom:34px}
.bldg::after{content:"";position:absolute;left:50%;bottom:0;width:40px;height:24px;transform:translateX(-50%);border:2px solid var(--wall-edge);border-bottom:0;border-radius:4px 4px 0 0;background:repeating-linear-gradient(90deg,var(--sill) 0 2px,transparent 2px 6px),var(--slab)}
.compact .bldg{padding-bottom:28px}
.compact .bldg::after{width:32px;height:19px}
/* the ground: a plinth under the building */
.ground{height:7px;border-top:3px solid var(--wall-edge);background:var(--slab);margin:0 -10px;border-radius:0 0 3px 3px}
.floor{display:flex;align-items:flex-start;gap:10px;padding:8px 0}
.floor+.floor{border-top:2px solid var(--slab)}
.fl{flex:none;width:30px;padding-top:13px;font-size:.74rem;line-height:1.15;color:var(--muted);text-align:center}
.wins{flex:1;display:flex;flex-wrap:wrap;gap:8px 12px}
.win{display:flex;flex-direction:column;align-items:center;gap:3px;padding:2px;border:0;background:none;border-radius:6px;min-width:52px;color:var(--ink)}
.glass{position:relative;display:block;width:44px;height:52px;border:2px solid var(--st,var(--line));border-radius:4px;background:linear-gradient(to top,var(--green) var(--fill),transparent var(--fill)),var(--surface-2);box-shadow:0 5px 0 -2px var(--sill);transition:--fill .9s cubic-bezier(.2,.8,.2,1),box-shadow .15s}
.glass::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid var(--st,var(--line));opacity:.3;transform:translateX(-1px)}
.win .u{max-width:64px;font-size:.8rem;font-weight:600;font-stretch:90%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win .u{margin-top:2px}
button.win:hover .glass{box-shadow:0 5px 0 -2px var(--sill),0 0 0 3px var(--green-soft)}
.s-paid{--st:var(--green)}
.s-partial{--st:var(--amber)}
.s-due{--st:var(--red)}
.s-vacant{--st:var(--muted)}
.s-upcoming{--st:var(--muted)}
.s-upcoming .glass,.legend .s-upcoming i{border-style:dashed}
.glass .dot{position:absolute;top:-6px;right:-6px;z-index:1;width:13px;height:13px;border-radius:50%;background:var(--red);border:2px solid var(--wall)}
.legend .s-dot i{width:10px;height:10px;border:0;border-radius:50%;background:var(--red)}
.win.ghost .glass,.win.ghost .glass::after{border-color:var(--line);border-style:dashed}
.compact .glass{width:34px;height:40px}
.compact .win{min-width:42px}
.compact .wins{gap:6px 8px}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;margin:12px 6px 0;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:11px;height:13px;border:2px solid var(--st);border-radius:2px}
.legend .s-paid i{background:var(--green)}
.legend .s-partial i{background:linear-gradient(to top,var(--green) 50%,transparent 50%)}
.legend .s-vacant i{border:1.5px solid var(--line);background:linear-gradient(to top right,transparent 44%,var(--muted) 44%,var(--muted) 56%,transparent 56%)}
/* flats from the flat list with nobody in them: empty (crossed) or under repair (hatched) */
.s-repair{--st:var(--amber)}
.win.s-vacant .glass{border-style:dashed;background:linear-gradient(to top right,transparent 48%,var(--line) 48%,var(--line) 52%,transparent 52%),var(--surface-2)}
.win.s-repair .glass{border-style:dashed;background:repeating-linear-gradient(-45deg,var(--amber-soft) 0 5px,transparent 5px 10px),var(--surface-2)}
.win.s-vacant .u,.win.s-repair .u{color:var(--muted)}
.legend .s-repair i{border:1.5px dashed var(--amber);background:repeating-linear-gradient(-45deg,var(--amber) 0 2px,transparent 2px 4px)}
.legend .lg-bill i{border:1.5px solid var(--muted)}
.legend .lg-got i{border:0;background:var(--green)}

/* totals */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:20px 0 0;padding:2px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--lift)}
.stats.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stat{padding:10px 8px 11px 0;min-width:0}
.stat+.stat{padding-left:12px;border-left:1px solid var(--line)}
.stat small{display:block;font-size:.8rem;color:var(--muted)}
.stat b{display:block;font-size:1.22rem;font-weight:700;font-stretch:82%;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prior{margin:10px 0 0;font-size:.92rem;color:var(--red)}
.prior b{font-stretch:88%}
.prior.pend{color:var(--muted)}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;margin:18px 0 10px;padding:2px;scrollbar-width:none}
.chips.tight{margin:8px 0 0;flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.9rem;min-height:36px;white-space:nowrap}
.chip .n{color:var(--muted);font-stretch:90%;margin-left:6px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.75}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--lift)}
.sheet .list{box-shadow:none}
.list>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;padding-right:14px;min-height:64px}
.row-hit{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 0 11px 14px;border:0;background:none;text-align:left}
.row-btn{width:100%;border:0;background:var(--surface);padding:11px 14px;text-align:left;gap:12px}
.list>.row-btn+.row-btn,.list>*+.row-btn{border-top:1px solid var(--line)}
.row-hit:hover,.row-btn:hover{background:var(--surface-2)}
.row-hit:focus-visible,.row-btn:focus-visible{outline-offset:-3px}
.unit{flex:none;min-width:46px;height:30px;padding:0 7px;display:inline-grid;place-items:center;border-radius:8px;background:var(--plate);color:var(--plate-ink);border:1px solid transparent;box-shadow:inset 0 -2px 0 rgba(0,0,0,.06);font-weight:700;font-size:.86rem;font-stretch:90%;white-space:nowrap}
.unit.big{min-width:54px;height:42px;font-size:1rem;border-radius:10px}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:.86rem;color:var(--muted)}
.row-sub span{white-space:nowrap}
.row-side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:10px 0}
.amt{flex:none;font-weight:700;font-stretch:84%;font-size:1.05rem;white-space:nowrap}
.muted{flex:none;color:var(--muted);font-size:.84rem;white-space:nowrap}
.list-empty{margin:0;padding:18px 14px;color:var(--muted);font-size:.92rem}
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;white-space:nowrap;background:var(--bs);color:var(--bi)}
.b-paid{--bs:var(--green-soft);--bi:var(--green)}
.b-partial{--bs:var(--amber-soft);--bi:var(--amber)}
.b-due{--bs:var(--red-soft);--bi:var(--red)}
.b-up{--bs:var(--surface-2);--bi:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.date{flex:none;width:40px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.date b{font-size:1.15rem;font-stretch:85%}
.date small{font-size:.72rem;color:var(--muted)}

/* sections */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 0 14px}
.sec-head h2{margin:0;font-size:1.5rem;font-weight:700;font-stretch:108%}
.sub{margin:24px 0 8px;font-size:1rem;font-weight:700}
.disclose{display:flex;align-items:center;justify-content:space-between;width:100%;margin:22px 0 8px;padding:12px 2px 4px;border:0;border-top:1px solid var(--line);background:none;font-weight:600;color:var(--muted)}
.empty{margin:0;padding:24px 18px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}
.grp{margin-top:18px}
.grp-head{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 8px}
.grp-head h3{margin:0;font-size:1.05rem}
.grp-head span{font-size:.88rem;color:var(--muted)}
.filter{display:flex;align-items:center;gap:10px}
.filter span{font-size:.9rem;color:var(--muted);flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:9px 16px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:.95rem;text-decoration:none;line-height:1.2;text-align:center;transition:transform .08s,filter .15s,background .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn-primary{background:var(--green);color:var(--green-ink);box-shadow:0 6px 14px -8px rgba(0,86,63,.7)}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-ghost.txt-due{color:var(--red)}
.btn-danger,.btn-ghost.btn-danger{background:var(--red);color:var(--red-ink);border-color:var(--red)}
.btn-sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:9px}
.btn-block{width:100%}

/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:var(--scrim);animation:fade .2s ease-out}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:640px;max-height:calc(100% - 28px - env(safe-area-inset-top,0px));overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:20px 20px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet:focus{outline:none}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sh-size{display:none}
@media (min-width:760px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(580px,calc(100% - 40px));max-height:88vh;border-radius:18px;padding:18px 22px 22px;transform:translate(calc(-50% + var(--dx,0px)),calc(-50% + var(--dy,0px)));animation:pop .22s cubic-bezier(.2,.8,.2,1)}
  .grab{display:none}
  /* a window is moved by dragging its title bar (the buttons on it still work as buttons) */
  .sheet .sh-head,.sheet .c-title{cursor:move;touch-action:none;user-select:none;-webkit-user-select:none}
  body.dragging,body.dragging *{cursor:move!important;user-select:none!important;-webkit-user-select:none!important}
  body.resizing,body.resizing *{cursor:var(--rs-cur)!important;user-select:none!important;-webkit-user-select:none!important}
  /* on a bigger screen a window can be made large (nearly the whole screen) and back, and stays that way */
  .sh-size{display:inline-grid}
  .sheet.big{width:calc(100% - 48px);max-width:1280px;max-height:94vh;padding:22px 30px 28px}
}
@media (min-width:1000px){
  .sheet{width:min(720px,calc(100% - 80px));max-width:none}
  .sheet.slim{width:min(480px,calc(100% - 80px))}
  .sheet.big{max-width:1280px}
}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@keyframes pop{from{transform:translate(calc(-50% + var(--dx,0px)),calc(-48% + var(--dy,0px))) scale(.98);opacity:0}}
.sh-head{display:flex;align-items:center;gap:12px;margin:0 0 14px}
.sh-head .grow{flex:1;min-width:0}
.sh-head h3{margin:0;font-size:1.3rem;font-weight:700;line-height:1.25}
.sh-head p{margin:2px 0 0;font-size:.88rem;color:var(--muted)}
.sh-head p a{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:600}
.bal{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:12px;margin:0 0 12px;font-weight:600}
.bal b{font-size:1.45rem;font-stretch:84%;line-height:1}
.bal.due{background:var(--red-soft);color:var(--red)}
.bal.ok{background:var(--green-soft);color:var(--green)}
.bal.up{background:var(--surface-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.bal small{display:block;margin-top:2px;font-size:.84rem;font-weight:500;opacity:.9}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 14px}
.actions .btn{flex-direction:column;gap:3px;min-height:62px;padding:8px 4px;font-size:.86rem}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px;margin:0 0 6px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}
.facts dt{font-size:.78rem;color:var(--muted)}
.facts dd{margin:0;font-weight:600;font-stretch:92%;overflow-wrap:anywhere}
.search{margin:0 0 12px}
.note{margin:10px 0 0;padding:8px 12px;border-left:3px solid var(--line);color:var(--muted);font-size:.92rem;white-space:pre-wrap}
.hint{margin:4px 0 8px;font-size:.84rem;color:var(--muted)}
.danger{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 4px;padding-top:14px;border-top:1px solid var(--line)}
.danger .btn{flex:1 1 160px}
.c-title{margin:4px 0 6px;font-size:1.25rem}

/* forms */
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px;min-width:0}
.field>label,.field>.lab{font-size:.88rem;font-weight:600}
.input{width:100%;min-height:46px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);font-size:1rem}
textarea.input{min-height:72px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 2px var(--green)}
.err{font-size:.8rem;color:var(--red)}
.err:empty{display:none}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.fs{border:0;padding:0;margin:4px 0}
.fs legend{padding:0;margin:0 0 8px;font-weight:700;font-size:.95rem}
.mp{display:grid;grid-template-columns:1.4fr 1fr;gap:8px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;min-height:38px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2);cursor:pointer;font-size:.92rem}
.seg input:checked+span{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:2px}
.form-actions{display:flex;gap:10px;margin-top:16px}
.form-actions>*{flex:1}
.form-actions.wrap{flex-wrap:wrap}
.form-actions.wrap>*{flex:1 1 150px}
.total-line{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;border-top:2px solid var(--ink);margin-top:4px}
.total-line b{font-size:1.35rem;font-stretch:84%}
.pay-hint{margin:-2px 0 12px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:.92rem}
.pay-hint p{margin:0}
.pay-hint .hint{margin:6px 0 0}
.check{display:flex;align-items:center;gap:10px;margin:12px 0 4px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--green)}
.result{margin:10px 0 0;font-size:.95rem}
.msg{min-height:180px;font-size:.95rem;line-height:1.6}

/* the receipt: a carbon-copy page from a receipt book */
.receipt{position:relative;margin:2px 0 6px;padding:24px 18px 18px;background:var(--paper);color:var(--carbon);border-radius:3px;box-shadow:0 1px 1px rgba(60,48,10,.12),0 10px 26px rgba(60,48,10,.18);overflow:hidden}
.receipt::before{content:"";position:absolute;left:0;right:0;top:0;height:10px;background:radial-gradient(circle at 7px 0,var(--surface) 4.5px,transparent 5px) 0 0/14px 10px repeat-x}
.rc-head{text-align:center;line-height:1.3}
.rc-head strong{display:block;font-size:1.25rem;font-weight:800;font-stretch:112%}
.rc-head span{display:block;font-size:.8rem;opacity:.85}
.rc-title{display:flex;align-items:center;gap:10px;margin:10px 0 8px;font-size:.84rem;font-weight:700}
.rc-title::before,.rc-title::after{content:"";flex:1;border-top:3px double currentColor;opacity:.7}
.rc-title span{border:1.5px solid currentColor;border-radius:999px;padding:1px 12px}
.rc-meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.84rem;margin:0 0 6px}
.rc-meta b{font-family:var(--hand);font-weight:600;font-size:.98rem}
.rc-meta .rc-no{font-family:var(--font);color:var(--stamp);font-weight:700;font-stretch:78%;letter-spacing:.12em}
.rc-line{display:flex;align-items:baseline;gap:8px;margin:7px 0}
.rc-line>span{flex:none;width:64px;font-size:.84rem}
.rc-line>b{flex:1;min-width:0;padding:0 4px 1px;border-bottom:1.5px dotted rgba(51,50,124,.55);font-family:var(--hand);font-weight:600;font-size:1.06rem;line-height:1.4;text-shadow:0 0 .6px rgba(51,50,124,.6)}
.rc-ack{margin:12px 0 0;font-size:.82rem}
.rc-after{margin:2px 0 0;font-size:.82rem;font-weight:700}
.rc-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px}
.rc-amt{padding:5px 12px;border:2px solid currentColor;border-radius:3px;font-size:1.3rem;font-weight:800;font-stretch:84%;white-space:nowrap}
.rc-sign{min-width:128px;text-align:center}
.rc-sign .sig{display:block;min-height:1.6em;padding:0 6px 2px;border-bottom:1.5px solid currentColor;font-family:var(--hand);font-size:1.12rem;font-weight:600}
.rc-sign small{display:block;margin-top:3px;font-size:.74rem}
.stamp{position:absolute;right:14px;bottom:60px;width:100px;height:100px;color:var(--stamp);opacity:.86;transform:rotate(-14deg);mix-blend-mode:multiply;pointer-events:none}
.receipt.fresh .stamp{animation:thump .55s cubic-bezier(.2,.9,.3,1.25) .2s both}
@keyframes thump{from{opacity:0;transform:rotate(-14deg) scale(1.7)}to{opacity:.86;transform:rotate(-14deg) scale(1)}}

/* several houses */
.bswitch{max-width:680px;margin:0 auto;padding:0 16px 10px;display:flex;align-items:center;gap:8px}
#bswitch:empty{display:none}
/* the houses are one dropdown (house icon, name, arrow), so the sign-out button on the right always stays in view */
.bs-pick{position:relative;flex:0 1 auto;min-width:0;max-width:100%;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink)}
.bs-pick>svg{position:absolute;top:50%;transform:translateY(-50%);pointer-events:none}
.bs-pick>svg:first-child{left:12px}
.bs-pick>svg:last-child{right:12px}
.bs-sel{appearance:none;-webkit-appearance:none;min-width:0;max-width:100%;min-height:40px;padding:6px 36px 6px 38px;border:0;border-radius:999px;background:transparent;color:inherit;font-weight:600;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.bs-sel option{color:var(--ink);background:var(--surface);font-weight:400}
.top .bs-pick{background:var(--head-soft);border-color:var(--head-line);color:var(--head-ink)}
.top .bs-pick:hover{background:var(--head-line)}
.bs-out{display:inline-flex;align-items:center;gap:6px;margin-left:auto}
.bs-out svg{flex:none}
/* sign-out is red, so it never reads as one of the house buttons */
.top .chip.bs-out,.top .chip.bs-out:hover{background:var(--red);border-color:var(--red);color:var(--red-ink);font-weight:600}
.top .chip.bs-out:hover{filter:brightness(1.1)}
.bfacs{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:0 22px}
.bfac{display:flex;flex-direction:column;align-items:center;min-width:0}
.bfac .bldg-wrap{min-width:150px;margin-top:20px}
.bname{margin:12px 0 0;padding:4px 8px;border:0;background:none;color:var(--ink);font-weight:700;font-size:.95rem;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.bhead{margin:22px 2px 8px}

/* meter readings and the monthly bill */
.quick{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 0}
.quick .btn{flex:1 1 150px}
.mlist{border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
.mrow{display:grid;grid-template-columns:auto minmax(0,1fr) 118px;column-gap:12px;align-items:center;padding:12px 0}
.mrow+.mrow{border-top:1px solid var(--line)}
.mrow .mid{min-width:0}
.mname{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msub{font-size:.8rem;color:var(--muted)}
.mrow .input{text-align:right;min-height:42px}
.mcalc{grid-column:2 / -1;margin-top:4px;font-size:.86rem;font-weight:600;color:var(--green)}
.mcalc:empty{display:none}
.mrow .err{grid-column:2 / -1}
.meter-calc{margin:0 0 10px;font-weight:600;color:var(--green)}
.receipt.bill{background:#E6EEFF}
.bl{margin:12px 0 0}
.bl-row{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:.92rem}
.bl-row>span{flex:none;max-width:62%}
.bl-row .lead{flex:1;min-width:12px;border-bottom:1.5px dotted rgba(51,50,124,.45)}
.bl-row b{font-family:var(--hand);font-weight:600;font-size:1.02rem;white-space:nowrap}
.bl-meter{margin:-2px 0 4px 10px;font-size:.78rem;opacity:.85}
.bl-total{margin-top:6px;padding-top:7px;border-top:2px solid currentColor;font-weight:800}
.bl-lab{display:block;margin-bottom:2px;font-size:.74rem}
.bl-due{text-align:right;font-size:.82rem}
.bl-due b{display:block;font-family:var(--hand);font-size:1.15rem;font-weight:600}

/* income and expenses */
.io-actions{display:flex;flex-wrap:wrap;gap:8px;margin:-4px 0 4px}
.io-actions .btn{flex:1 1 140px}
.grp-head b{font-stretch:90%}
.c-exp{fill:var(--red);opacity:.75}
.legend .lg-exp i{border:0;background:var(--red);opacity:.75}
.cats{border:1px solid var(--line);border-radius:12px;padding:2px 14px;background:var(--surface);box-shadow:var(--lift)}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:10px 0}
.cat+.cat{border-top:1px solid var(--line)}
.cat span{font-size:.92rem}
.cat b{font-stretch:88%}
.cat i{grid-column:1 / -1;position:relative;display:block;height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.cat i::after{content:"";position:absolute;inset:0 auto 0 0;width:var(--w);border-radius:3px;background:var(--red);opacity:.7}

/* tenant report */
.rp-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0 4px}
.rp-stat{min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rp-stat small{display:block;font-size:.78rem;color:var(--muted)}
.rp-stat b{display:block;font-size:1.08rem;font-stretch:84%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-now{margin:8px 2px 0;font-weight:600;font-size:.95rem}
.rp-units{display:block;font-size:.74rem;color:var(--muted)}
.tbl td.ok{color:var(--green)}
.tbl td.up{color:var(--muted)}

/* bill or receipt as a picture */
.slip-img{display:block;width:100%;height:auto;margin:2px 0 6px;border-radius:8px;box-shadow:0 8px 24px rgba(20,30,25,.18)}

/* printing: A4 pages drawn as pictures, shown here and printed alone */
.pr-pages{display:flex;flex-direction:column;gap:14px;margin:14px 0 6px}
.pr-pages img{display:block;width:100%;height:auto;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(20,30,25,.14),0 8px 22px rgba(20,30,25,.16)}
#print-root{display:none}
@media print{
  @page{size:A4;margin:0}
  body.printing{background:#fff;overflow:visible!important}
  body.printing::before{display:none}
  body.printing>*:not(#print-root){display:none!important}
  body.printing #print-root{display:block}
  #print-root .pp{width:210mm;height:296.8mm;overflow:hidden;break-after:page;page-break-after:always}
  #print-root .pp:last-child{break-after:auto;page-break-after:auto}
  #print-root img{display:block;width:100%;height:auto}
}

/* electricity slabs */
.tariff{border:1px solid var(--line);border-radius:12px;padding:2px 12px;background:var(--surface)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 108px;align-items:center;gap:2px 12px;padding:7px 0}
.trow+.trow{border-top:1px solid var(--line)}
.trow>span:first-child{font-size:.9rem}
.trow .input{text-align:right;min-height:40px}
.trow .err{grid-column:1 / -1}

/* backup */
.nudge{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:12px 14px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem;color:var(--muted)}
.nudge .btn{flex:none}
.file-btn{position:relative;cursor:pointer}
.file-btn input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.paste summary{margin:16px 0 8px;color:var(--green);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:.92rem}
#restore-err{margin:10px 0 0}

/* help and what's new */
.help-list{display:flex;flex-direction:column;gap:8px}
.help-list details{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.help-list summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:10px 14px;font-weight:600;cursor:pointer;list-style:none}
.help-list summary::-webkit-details-marker{display:none}
.help-list summary svg{flex:none;color:var(--muted);transition:transform .2s}
.help-list details[open] summary svg{transform:rotate(180deg)}
.help-list ul{margin:0;padding:0 14px 12px 34px;font-size:.92rem;line-height:1.6}
.help-list li+li,.chg li+li{margin-top:6px}
.ver{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 12px;margin-top:18px;padding-top:12px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.chg h4{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;margin:18px 0 6px;font-size:1rem;font-weight:700}
.chg section:first-child h4{margin-top:0}
.chg h4 small{font-size:.84rem;font-weight:500;color:var(--muted)}
.chg ul{margin:0;padding:0 0 0 22px;font-size:.92rem;line-height:1.6}
.news{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 12px;margin:0 0 16px;padding:12px 14px;border-radius:12px;background:var(--green-soft)}
.news .grow{flex:1;min-width:12em}
.news b{display:block;color:var(--green)}
.news .grow span{font-size:.9rem}
.news-btns{display:flex;gap:8px;flex:none}

/* reports */
.chart{display:block;width:100%;height:auto;margin:8px 0 2px}
.c-base{stroke:var(--line);stroke-width:1}
.c-bill{fill:none;stroke:var(--muted);stroke-width:1.2}
.c-got{fill:var(--green)}
.c-none{fill:var(--line)}
.c-lab{fill:var(--muted);font-size:9px;font-family:var(--font)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-top:16px;box-shadow:var(--lift)}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th,.tbl td{padding:9px 12px;text-align:right;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl thead th{font-size:.8rem;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
.tbl tbody td{border-bottom:1px solid var(--line)}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tfoot td{font-weight:700;border-top:2px solid var(--ink)}
.tbl .num{font-stretch:86%}
.cash{margin:12px 2px 0;font-size:.92rem;color:var(--muted)}
.cash b{color:var(--ink);font-stretch:88%}

/* first run */
.onb{text-align:center;padding:4px 0 10px}
.onb .bldg-wrap{margin:30px auto 26px}
.onb h2{margin:0 0 8px;font-size:1.6rem;font-weight:700;font-stretch:108%;line-height:1.25}
.onb p{margin:0 auto 22px;max-width:30em;color:var(--muted)}
.onb-actions{display:flex;flex-direction:column;gap:10px;max-width:360px;margin:0 auto}

/* sign-in screen of the website version */
#login-root:empty{display:none}
.login-wrap{position:fixed;inset:0;z-index:25;background:var(--bg);display:grid;place-items:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.login-card{width:min(420px,100%);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 20px 16px;box-shadow:var(--lift)}
.login-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 18px}
.login-brand{display:inline-flex;align-items:center;gap:10px;min-width:0;color:var(--green);font-size:1.15rem}
.login-brand b{color:var(--ink);font-stretch:110%}
.login-card h2{margin:0 0 6px;font-size:1.35rem;line-height:1.3}
.login-card .hint{margin:0 0 14px}
.login-card form .btn{margin-top:4px}
.login-msg{margin:0 0 14px;padding:10px 12px;border-radius:10px;font-size:.92rem;background:var(--red-soft);color:var(--red)}
.login-msg.ok{background:var(--green-soft);color:var(--green)}
.login-forgot{display:block;margin:12px auto 0}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:30;max-width:calc(100% - 32px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:.92rem;box-shadow:var(--shadow);opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.err{background:var(--red);color:var(--red-ink)}

@media (max-width:370px){
  .grid2{grid-template-columns:1fr}
  .stat b{font-size:1.05rem}
}
/* computer screens: the menu moves to a green sidebar, the header turns light, and pages use the width */
.side-brand,.side-out{display:none}
.home-grid{display:block}
@media screen and (min-width:1000px){
  :root{--side:236px}
  body{padding-left:var(--side)}
  body::before{background:var(--bg)}
  /* sidebar */
  .tabs{top:0;bottom:0;right:auto;width:var(--side);background:var(--head);border-top:0;box-shadow:none;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  .tabs-in{max-width:none;display:flex;flex-direction:column;gap:4px;padding:16px 14px}
  .side-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;color:var(--head-ink);font-size:1.2rem;font-weight:700;font-stretch:110%;line-height:1.2}
  .side-brand svg{flex:none;padding:7px;border-radius:12px;background:var(--head-soft);box-sizing:content-box}
  .tab{flex-direction:row;justify-content:flex-start;gap:12px;min-height:48px;padding:8px 14px;border-radius:12px;color:var(--head-muted);font-size:1rem;text-align:left}
  .tab svg{padding:0;background:none}
  .tab:hover{background:var(--head-soft);color:var(--head-ink)}
  .tab:hover svg{background:none}

ভাড়াটিয়া আছেন সেটা বাদ যাবে।": "Below is what each sheet will add. Nothing already here is deleted, and flats that already have a tenant are left as they are.", "ফাইলে ফ্ল্যাট, নাম আর ভাড়ার কলাম পাওয়া গেল না। শিটের ওপরের দিকের একটা সারিতে Flat (বা Floor), Name আর Rent লেখা থাকতে হবে।": "No flat, name and rent columns were found in the file. A row near the top of the sheet needs the headings Flat (or Floor), Name and Rent.", "বিদ্যুৎ বিলে ভ্যাট যোগ করা যায়: সেটিংসে “{0}”-এর নিচে ভ্যাটের হার লিখুন।": "Electricity bills can include VAT: enter the rate in Settings under “{0}”.", "ভাড়ার হিসাব": "Rent", "ভ্যাট (%)": "VAT (%)", "ভ্যাট {0}%": "VAT {0}%", "ভ্যাট দিলে বিদ্যুৎ বিল আর মিটারের নির্দিষ্ট চার্জ (যেমন ডিমান্ড চার্জ) মিলিয়ে তার ওপর সেই হারে যোগ হয়। ভ্যাট না থাকলে ঘরটা খালি রাখুন।": "VAT is added at this rate on the electricity charge plus the meter's fixed charge (such as a demand charge). Leave it empty if there is no VAT.", "ভ্যাটের হার “{0}”-এর নিচের ঘরে, আর ডিমান্ড চার্জ ভাড়াটিয়ার মিটারের “{1}” ঘরে লিখুন। দুটোই যেকোনো সময় বদলানো যায়।": "Enter the VAT rate in the box under “{0}”, and the demand charge in the tenant's meter box “{1}”. Both can be changed at any time.", "যোগ হবে": "Will be added", "যোগ হবে: {0}টি নতুন বাড়ি, {1}টি ফ্ল্যাট আর {2} জন ভাড়াটিয়া।": "To be added: {0} new houses, {1} flats and {2} tenants.", "শিট": "Sheet", "শুধু .xlsx বা .ods ফাইল আনা যায়। পুরনো .xls ফাইল হলে এক্সেলে খুলে “Save As” দিয়ে .xlsx হিসেবে রাখুন।": "Only .xlsx or .ods files can be imported. For an old .xls file, open it in Excel and use “Save As” to save it as .xlsx.", "{0}টি বাড়িতে {1}টি ফ্ল্যাট আর {2} জন ভাড়াটিয়া যোগ হয়েছে": "Added {1} flats and {2} tenants in {0} houses", "নতুন কিছু যোগ করার নেই, এই ফাইলের সব আগে থেকেই খাতায় আছে।": "Nothing new to add: everything in this file is already in the ledger.", "মিটারের শেষ রিডিং": "Last meter reading", "{0} মাসের বিল": "Bills for {0}", "“{0}”-এর তালিকার ওপরের বোতাম বা “{1}” পাতার নিচের “{2}” থেকে চাপুন।": "Use function facadeHTML(rows, M, force) {
  const groups = new Map(), unitOf = r => (r.flat ? r.flat.no : r.t.unit);
  for (const r of rows) {
    const f = floorOf(unitOf(r)), k = f == null ? -1 : f;
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(r);
  }
  const keys = [...groups.keys()].sort((a, b) => (a === -1) - (b === -1) || b - a);
  const only = keys.length === 1 && keys[0] === -1;
  const compact = force || rows.length > 12 || keys.length > 5;
  const floors = keys.map(k => {
    const lab = k === -1 ? tr('অন্য') : k === 0 ? (tr('নিচ') + '<br>' + tr('তলা')) : bn(k) + ('<br>' + tr('তলা'));
    const wins = groups.get(k).sort((a, b) => cmpUnit(unitOf(a), unitOf(b))).map(r => {
      if (r.flat) return `<button type="button" class="win s-${r.st}" data-act="flat" data-id="${esc(r.flat.id)}" aria-label="${esc(r.flat.no)}: ${r.lab}"><span class="glass"></span><span class="u">${esc(r.flat.no)}</span></button>`;
      const pct = r.ch.amount > 0.004 ? Math.min(100, Math.round(r.ch.covered / r.ch.amount * 100)) : 100;
      const fk = r.t.id + '|' + M, prev = FILLS[fk] == null ? 0 : FILLS[fk];
      return `<button type="button" class="win s-${r.st}" data-act="tenant" data-id="${esc(r.t.id)}" aria-label="${esc(r.t.unit)}, ${esc(r.t.name)}: ${stLabel(r.st, M)}${r.prior > 0.004 ? (', ' + tr('আগের বকেয়া আছে')) : ''}"><span class="glass" data-fk="${esc(fk)}" data-fill="${pct}" style="--fill:${prev}%">${r.prior > 0.004 ? '<i class="dot"></i>' : ''}</span><span class="u">${esc(r.t.unit || '—')}</span></button>`;
    }).join('');
    return `<div class="floor">${only ? '' : `<span class="fl">${lab}</span>`}<div class="wins">${wins}</div></div>`;
  }).join('');
  return `<div class="bldg-wrap${compact ? ' compact' : ''}"><div class="bldg">${floors}</div><div class="ground"></div></div>`;
}

document.addEventListener('pointermove', e => {
  if (!RS.on || e.pointerId !== RS.id) return;
  const sh = RS.sh;
  if (!sh.isConnected) { resizeEnd(); return; }
  const W = window.innerWidth, H = window.innerHeight, r = RS.r, ed = RS.edge, mx = e.clientX - RS.x, my = e.clientY - RS.y;
  let L = r.left, T = r.top, R = r.right, B = r.bottom;
  if (ed.includes('e')) R = Math.min(Math.max(W - 8, r.right), Math.max(L + 360, r.right + mx));
  if (ed.includes('w')) L = Math.max(Math.min(8, r.left), Math.min(R - 360, r.left + mx));

  if (ed.includes('n')) T = Math.max(Math.min(8, r.top), Math.min(B - 220, r.top + my));
  sheetSize(sh, R - L, B - T, true);
  const w = sh.offsetWidth, h = sh.offsetHeight;
  if (ed.includes('w')) L = R - w;
  if (ed.includes('n')) T = B - h;
  const ox = Math.round(L - (W - w) / 2), oy = Math.round(T - (H - h) / 2);

function resizeEnd() {
  if (!RS.on) return;

  try { localStorage.setItem(WH_KEY, JSON.stringify(SHEET_WH)); } catch (e) {}

    const b = sh.querySelector('[data-act="sheet-size"]');

  }
}

function reminderText(t, L) { return LANG === 'en' ? reminderEn(t, L) : reminderBn(t, L); }
function reminderEn(t, L) {
  const s = S.core.settings;
  const unpaid = L.charges.filter(c => c.amount - c.covered > 0.004);
  const od = unpaid.filter(c => overdue(c)), up = unpaid.filter(c => !overdue(c)).slice(0, 1);
  if (!od.length && !up.length) return '';
  const bd = bOf(t), where = [t.unit ? 'flat ' + t.unit : '', bd.name].filter(Boolean).join(', ');
  const sum = a => r2(a.reduce((x, c) => x + c.amount - c.covered, 0));
  const what = a => {
    const keys = a.filter(c => c.key !== 'opening').map(c => c.key);
    const m = keys.length ? 'rent and bills for ' + monthsText(keys) : '';
    return a.some(c => c.key === 'opening') ? (m ? 'previous dues and ' + m : 'previous dues') : m;
  };
  const at = where ? ` (${where})` : '';
  let body;
  if (od.length) {
    body = `${money(sum(od))} is overdue for ${what(od)}${at}. Please pay as soon as possible.`;
    if (up.length) body += ` In addition, ${money(sum(up))} for ${what(up)} is due ${byWhen(up[0].key)}.`;
  } else {
    body = `This is a reminder that ${money(sum(up))} for ${what(up)}${at} is due ${byWhen(up[0].key)}.`;
  }
  return [`Dear ${t.name},`, body, '', 'Regards,', [s.owner, s.phone].filter(Boolean).join(', ') || 'Landlord'].join('\n');
}
function reminderBn(t, L) {
  const s = S.core.settings;
  const unpaid = L.charges.filter(c => c.amount - c.covered > 0.004);
  const od = unpaid.filter(c => overdue(c)), up = unpaid.filter(c => !overdue(c)).slice(0, 1);
  if (!od.length && !up.length) return '';
  const bd = bOf(t), place = (bd.name ? bd.name + '-এর ' : '') + (t.unit ? t.unit + ' নম্বর ফ্ল্যাটের ' : '');
  const sum = a => r2(a.reduce((x, c) => x + c.amount - c.covered, 0));
  const what = a => {
    const keys = a.filter(c => c.key !== 'opening').map(c => c.key);
    const m = keys.length ? monthsText(keys) + ' মাসের ভাড়া ও বিল' : '';
    return a.some(c => c.key === 'opening') ? (m ? 'পূর্বের বকেয়া এবং ' + m : 'পূর্বের বকেয়া') : m;
  };
  let body;
  if (od.length) {
    body = `${place}${what(od)} বাবদ মোট ${money(sum(od))} বকেয়া রয়েছে। অনুগ্রহ করে যত দ্রুত সম্ভব পরিশোধ করুন।`;
    if (up.length) body += ` এ ছাড়া ${what(up)} বাবদ ${money(sum(up))} ${byWhen(up[0].key)} দিতে হবে।`;
  } else {
    body = `${place}${what(up)} বাবদ ${money(sum(up))} ${byWhen(up[0].key)} পরিশোধ করার অনুরোধ রইল।`;
  }
  return [`প্রিয় ${t.name},`, body, '', 'ধন্যবাদান্তে,', [s.owner, s.phone].filter(Boolean).join(', ') || 'বাড়িওয়ালা'].join('\n');
}

function moveOutSummary(t, end, adjust) {

/* ---------- the website as an installable app (PWA): only on http(s), never in the file or inside claude.ai ---------- */
// the icon's name on the phone is always the Bangla name from manifest.webmanifest
const APP_NAME = 'ভাড়ার খাতা';
const INSTALL_KEY = 'bharar-khata-install-later';
let installEvt = null;
const isStandalone = () => (!!window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (ON_WEB) {
  // the manifest and icons sit only next to the website's index.html, so the file and claude.ai versions never ask for them
  [['manifest', 'manifest.webmanifest'], ['apple-touch-icon', 'apple-touch-icon.png'], ['icon', 'icon-192.png']].forEach(([rel, href]) => {
    const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l);
  });
  // the phone's status bar takes the header's green (darker in dark mode)
  [['#00563F', '(prefers-color-scheme: light)'], ['#123A2D', '(prefers-color-scheme: dark)']].forEach(([c, m]) => {
    const t = document.createElement('meta'); t.name = 'theme-color'; t.content = c; t.media = m; document.head.appendChild(t);
  });
  if ('serviceWorker' in navigator) addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; render(); });
  addEventListener('appinstalled', () => { installEvt = null; toast(tr('অ্যাপ ইনস্টল হয়েছে, এখন আইকন থেকে খুলতে পারবেন')); render(); });
}

function storeState() {
  // ['ok' | 'wait' | 'err', what to tell the owner]
  if (Store.mode === 'db') {
    if (Store.status === 'error' || Store.failed.size) return ['err', tr('কিছু পরিবর্তন সংরক্ষণ হয়নি')];
    if (UI.conn) return ['err', tr('সংযোগ বিচ্ছিন্ন হয়েছে')];
    if (Store.status === 'saving' || Store.dirty.size || Store.busy.size) return ['wait', tr('সংরক্ষণ হচ্ছে…')];
    if (UI.stale) return ['wait', tr('তথ্য আনতে দেরি হচ্ছে')];
    return ['ok', tr('সব পরিবর্তন সংরক্ষিত')];
  }
  if (Store.mode === 'local') {
    if (Store.status === 'error') return ['err', tr('এই ব্রাউজারে সংরক্ষণ করা যায়নি')];
    if (Store.status === 'saving') return ['wait', tr('সংরক্ষণ হচ্ছে…')];
    return ['ok', tr('সব পরিবর্তন সংরক্ষিত')];

  return ['wait', tr('খাতা খোলা হচ্ছে…')];

// the newest version whose notes were seen in this browser; only read here, written when the owner taps
function seenVer() {
  if (UI.seenVer) return UI.seenVer;
  try { const v = localStorage.getItem(SEEN_KEY); return v ? (+v || 0) : 0; } catch (e) { return APP_VER; }
}
function markSeen() { UI.seenVer = APP_VER; try { localStorage.setItem(SEEN_KEY, String(APP_VER)); } catch (e) {} }
// the newest version worth the home-page notice; quiet entries (small fixes) are only listed in what's new
const newsVer = () => (changes().find(c => !c.quiet) || { v: APP_VER }).v;
// some tenant was added before version v came out (tenants without a date count as older)
function hadDataBefore(v) {
  const c = changes().find(x => x.v === v), since = c ? Date.parse(c.d + 'T00:00:00') : 0;
  return S.core.tenants.some(t => !(t.created >= since));
}
function newsHTML() {
  // nothing recorded in this browser and every tenant is newer than the version: a first-time owner or the demo, nothing to catch up on
  const seen = seenVer(), nv = newsVer();
  if (seen >= nv || (!seen && !hadDataBefore(nv))) return '';
  const c = changes().find(x => x.v === nv) || changes()[0];
  return `<div class="news"><div class="grow"><b>${tr('নতুন সংস্করণ এসেছে')}</b><span>${esc(c.items[0])}</span></div><div class="news-btns"><button type="button" class="btn btn-sm btn-primary" data-act="whats-new">${tr('দেখুন')}</button><button type="button" class="btn btn-sm btn-ghost" data-act="news-ok">${tr('ঠিক আছে')}</button></div></div>`;
}

        if (!impHas(e) || S.core.tenants.some(t => !t.left && t.bid === b.id && unitKey(t.unit) === unitKey(e.no))) continue;
        S.core.tenants.push(normTenant({ id: newId(), name: e.name || tr('{0} ফ্ল্যাটের ভাড়াটিয়া', e.no), unit: e.no, phone: e.phone, bid: b.id, start,

  tenant(f) {

      if (mStart == null || Number.isNaN(mStart)) { setErr(f, 'mStart', tr('শুরুর রিডিং লিখুন')); ok = false; }

    if (!ok) {

    if (id && !x) { Sheet.close(); return; }
    const g = n => f.elements[n].value.trim();
    const bid = S.core.buildings.some(b => b.id === f.elements.fbid.value) ? f.elements.fbid.value : S.core.buildings[0].id;
    const no = g('fno').slice(0, 20), area = parseAmount(g('farea')), rent = parseAmount(g('frent'));
    const dup = !!no && S.core.flats.some(y => y !== x && sameFlat(y, bid, no));
    setErr(f, 'fno', !no ? tr('ফ্ল্যাট নম্বর লিখুন') : dup ? tr('এই নম্বরের ফ্ল্যাট তালিকায় আগেই আছে') : '');
    setErr(f, 'farea', Number.isNaN(area) ? tr('শুধু সংখ্যা লিখুন') : '');
    setErr(f, 'frent', Number.isNaN(rent) ? tr('শুধু টাকার অঙ্ক লিখুন') : '');
    if (!no || dup || Number.isNaN(area) || Number.isNaN(rent)) { const e = f.querySelector('.err:not(:empty)'); const input = e && e.closest('.field').querySelector('input,select,textarea'); if (input) input.focus(); return; }
    const typeEl = f.querySelector('input[name="ftype"]:checked');
    const data = { bid, no, type: typeEl ? typeEl.value : 'flat', area: area || 0, rent: rent || 0, repair: !!f.elements.frepair.checked, note: f.elements.fnote.value.trim().slice(0, 160) };
    if (x) {
      // a flat renamed within its house keeps its tenants: their flat number changes with it
      if (x.bid === bid && unitKey(x.no) !== unitKey(no)) S.core.tenants.forEach(t => { if (sameFlat(x, t.bid, t.unit)) t.unit = no; });
      Object.assign(x, data);
      touch('core'); toast(tr('ফ্ল্যাটের তথ্য সংরক্ষিত হয়েছে')); render(); openFlat(x.id);
      return;
    }
    const nf = normFlat(Object.assign({ id: newId() }, data));
    S.core.flats.push(nf);
    touch('core'); toast(tr('ফ্ল্যাট যোগ হয়েছে')); render(); openFlat(nf.id);
  },
  agree(f) {
    const t = findT(f.dataset.id);
    if (!t) { Sheet.close(); return; }
    const date = f.elements.adate.value, from = f.elements.afrom.value;
    setErr(f, 'adate', isDate(date) ? '' : tr('সঠিক তারিখ দিন'));
    setErr(f, 'afrom', isDate(from) ? '' : tr('সঠিক তারিখ দিন'));
    if (!isDate(date) || !isDate(from)) return;
    // the terms belong to the house, so every tenant there gets the same ones
    const bid = bOf(t).id, terms = f.elements.terms.value.replace(/\r\n?/g, '\n').split('\n').map(x => x.trim()).filter(Boolean).join('\n').slice(0, 4000);
    if (terms !== (S.core.terms[bid] || '')) {
      // kept in house order, the same order a reload or a restored backup gives
      const next = Object.assign({}, S.core.terms, { [bid]: terms });
      S.core.terms = {};
      for (const b of S.core.buildings) if (next[b.id]) S.core.terms[b.id] = next[b.id];
      touch('core');
    }
    UI.agree = { tid: t.id, date, from, months: Math.max(0, Math.floor(+f.elements.amonths.value) || 0) };
    openPrint('agree', t.id);
  },
  settings(f) {
    const g = n => f.elements[n].value.trim();
    Object.assign(S.core.settings, { owner: g('owner').slice(0, 60), phone: g('sphone').slice(0, 20), dueDay: Math.min(28, Math.max(0, Math.floor(+g('dueDay')) || 0)) || (g('collect') === 'start' ? 10 : 0), collect: g('collect') === 'start' ? 'start' : 'end' });
    UI.month = null; touch('core'); Sheet.close(); toast(tr('সেটিংস সংরক্ষিত হয়েছে')); render();
  }
};
const LIVE = {
  import(f) {
    const plan = impPlan(f);
    plan.forEach(p => { const el = f.querySelector('#imp-l' + p.i); if (el) el.innerHTML = impRowsHTML(p); });
    const s = f.querySelector('#imp-sum');
    if (s) s.textContent = impSumText(plan);
    const m = f.querySelector('#imp-meter');
    if (m && f.elements.meterOn) m.hidden = !f.elements.meterOn.checked;
  },
  tenant(f, e) {
    if (e.target.name === 'meterOn') f.querySelector('#meter-fields').hidden = !e.target.checked;
    if (e.target.name === 'mMode') f.querySelector('#mrate-wrap').hidden = e.target.value !== 'flat';
  },
  meters(f, e) {
    const row = e.target.closest('.mrow');
    if (!row) return;
    const m = readMeter(row.dataset.prev, e.target.value, row.dataset.rate, row.dataset.fixed, row.dataset.mode, meterTariff(row.dataset.tid, f.dataset.m));
    row.querySelector('.mcalc').textContent = m && m.cur != null ? meterCalcText(m) : '';
  },
  settings(f, e) {
    if (e.target.name !== 'collect') return;
    const mode = f.elements.collect.value, cur = +f.elements.dueDay.value;
    f.elements.dueDay.innerHTML = dueOptions(mode, mode === 'start' ? cur || 10 : cur);
  },
  bill(f, e) {
    let s = 0;
    for (const n of ['rent', 'gas', 'water', 'service', 'elec', 'other']) if (f.elements[n]) s += parseAmount(f.elements[n].value) || 0;
    s -= parseAmount(f.elements.discount.value) || 0;
    if (f.elements.mCur) {
      if (e && e.target.name === 'mMode') f.querySelector('#brate-wrap').hidden = e.target.value !== 'flat';
      const m = readMeter(f.elements.mPrev.value, f.elements.mCur.value, f.elements.mRate.value, f.elements.mFixed.value, f.elements.mMode.value, meterTariff(f.dataset.id, f.dataset.m));
      f.querySelector('#meter-calc').textContent = m ? meterCalcText(m) : (tr('রিডিং আর দামে শুধু সংখ্যা লিখুন') + ('' + tr('।') + ''));
      if (m && m.cur != null && m.cur >= m.prev) s += meterAmount(m);
    }
    f.querySelector('.bill-total').textContent = money(Math.max(0, s));
  },
  pay(f, e) {
    if (e.type !== 'change' || e.target.name !== 'tid') return;
    const t = findT(f.elements.tid.value);
    if (!t) return;
    f.querySelector('#pay-hint').innerHTML = payHint(t);
    f.elements.amt.value = plainAmt(defaultAmount(t));
  },
  moveout(f, e) {
    if (e.type !== 'change') return;
    const t = findT(f.dataset.id);
    if (!t) return;
    f.querySelector('#mo-sum').innerHTML = moveOutSummary(t, readMonth(f, 'end'), f.elements.adjust ? f.elements.adjust.checked : true);
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('submit', e => {
  const f = e.target, h = FORMS[f.dataset.form];
  if (h) { e.preventDefault(); h(f); }
});
['input', 'change'].forEach(type => document.addEventListener(type, e => {
  const el = e.target;
  if (type === 'input' && el.dataset && el.dataset.search === 'tenants') { UI.q = el.value.slice(0, 60); const box = $('#t-list'); if (box) box.innerHTML = tenantsListHTML(); return; }
  if (type === 'change' && el.dataset && el.dataset.change === 'pay-tenant') { UI.payTenant = el.value; render(); return; }
  if (type === 'change' && el.dataset && el.dataset.change === 'report-period') { openTenantReport(el.dataset.id, el.value); return; }
  if (type === 'change' && el.dataset && el.dataset.change === 'print-period') { if (PRINT) openPrint(PRINT.kind, PRINT.id, el.value); return; }
  if (type === 'change' && el.dataset && el.dataset.change === 'building') {
    ACT.building({ dataset: { bid: el.value } });
    const s = $('#bswitch .bs-sel'); if (s) s.focus({ preventScroll: true });
    return;
  }
  if (type === 'change' && el.dataset && el.dataset.change === 'restore-file') {
    const file = el.files && el.files[0];
    el.value = '';
    if (!file) return;
    if (file.size > 8e6) { restoreErr(tr('ফাইলটা অনেক বড়।')); return; }
    file.text().then(askRestore, () => restoreErr(tr('ফাইলটা পড়া গেল না।')));
    return;
  }
  if (type === 'change' && el.dataset && el.dataset.change === 'import-file') {
    const file = el.files && el.files[0];
    el.value = '';
    if (file) readImport(file);
    return;
  }
  const f = el.form;
  if (f && LIVE[f.dataset.form]) LIVE[f.dataset.form](f, e);
}));
// don't lose a just-made change if the app is closed or switched away before the short save delay ends
function flushSaves() {
  if (!Store.dirty.size) return;
  clearTimeout(Store.timer);
  if (Store.mode === 'local') Store.saveLocal(); else if (Store.mode === 'db') Store.kick();
}
window.addEventListener('pagehide', flushSaves);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); });
document.addEventListener('keydown', e => {
  if (!Sheet.isOpen()) return;
  if (e.key === 'Escape') { e.preventDefault(); Sheet.close(); return; }
  if (e.key !== 'Tab') return;
  const sh = $('#sheet-root .sheet');
  const f = [...sh.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]),select,textarea')].filter(x => x.offsetParent !== null);
  if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && (document.activeElement === first || document.activeElement === sh)) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

function applyLang() {
  MONTHS = LANG === 'en' ? MONTHS_EN : MONTHS_BN;
  MONTHS_SHORT = LANG === 'en' ? MONTHS_SHORT_EN : MONTHS_SHORT_BN;
  document.documentElement.lang = LANG;
  document.title = tr('ভাড়ার খাতা');
  $('.tabs').setAttribute('aria-label', tr('প্রধান মেনু'));
}
applyLang();
render();
Store.boot();
})();
</script>
